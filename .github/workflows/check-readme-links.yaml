name: check-readme-links
on:
  pull_request:
    paths: ['**/*.md']
  workflow_dispatch:
    inputs:
      fail_on_error:
        description: 'true: fail the run (PR mode); false: file or update the issue (schedule mode)'
        type: boolean
        default: false
permissions: {}
jobs:
  check:
    uses: giantswarm/github-workflows/.github/workflows/check-readme-links.yaml@check-readme-links
    with:
      fail_on_error: ${{ github.event_name == 'pull_request' || inputs.fail_on_error }}
      config_ref: check-readme-links
    permissions:
      contents: read
      issues: write
